<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Entraday</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="Entraday logo" class="brand-logo" />
      <div class="brand-text">
        <span class="brand-name">Entraday</span>
        <small class="tagline">Powering Your Tomorrow, Today.</small>
      </div>
    </a>
    <nav class="nav" id="nav">
      <a href="index.html" class="nav-item">Home</a>
      <a href="it-solutions.html" class="nav-item">IT Solutions</a>
      <a href="products.html" class="nav-item">Products</a>
      <a href="managed-services.html" class="nav-item">Managed Services</a>
      <a href="about.html" class="nav-item">About Us</a>
      <a href="contact.html" class="nav-item">Contact</a>
    </nav>
    <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
  </div>
</header>

  <main class="container page contact-page">
    <section class="page-hero">
      <h1>Contact Us</h1>
      <p>Reach out for a consultation or demo.</p>
    </section>

    <section class="contact-grid">
      <form class="contact-form" action="#" method="post" onsubmit="alert('This is a demo form. Integrate with your backend or Formspree.')">
        <label>Name<input type="text" name="name" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Message<textarea name="message" rows="6" required></textarea></label>
        <button class="btn" type="submit">Send</button>
      </form>

      <aside class="contact-map">
        <h4>Our Office</h4>
        <p>123 Entraday Plaza<br/>City, Country</p>
        <div class="map-placeholder">Map placeholder (replace with embedded map)</div>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
  <div class="container footer-inner">
    <p>© 2025 Entraday. All Rights Reserved.</p>
    <div class="social">
      <a href="#" aria-label="Facebook">f</a>
      <a href="#" aria-label="X">x</a>
      <a href="#" aria-label="Instagram">ig</a>
      <a href="#" aria-label="YouTube">yt</a>
    </div>
  </div>
</footer>
  <script src="script.js"></script>
</body>
</html>
