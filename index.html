<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entraday — Coming Soon</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* FULLPAGE BACKGROUND IMAGE (FIXED) */
    .bg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: url("assets/coming-soon.png") no-repeat center center;
      background-size: contain; /* SHOW FULL IMAGE WITHOUT CROPPING */
      background-color: #ffffff; /* Fill white around edges */
      z-index: -1;
    }

    /* CENTERED TEXT */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #0b2f4a;
    }

    .content h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .content p {
      font-size: 18px;
      color: #333;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .content h1 { font-size: 34px; }
      .content p { font-size: 15px; }
    }

    @media (max-width: 480px) {
      .content h1 { font-size: 26px; }
      .content p { font-size: 14px; }
    }
  </style>
</head>

<body>

  <!-- FULL BACKGROUND IMAGE -->
  <div class="bg"></div>

  <!-- CENTERED TEXT -->
<div style="
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255, 255, 0, 0.35);
  padding: 25px 35px;
  border-radius: 12px;
  text-align: center;
">
  <h1 style="margin: 0 0 12px 0;">COMING SOON</h1>
  <p style="margin: 0; font-size: 18px; line-height: 1.4;">
    We’re building something amazing.<br>
    Stay tuned for the future of energy trading.
  </p>
</div>

</body>
</html>
